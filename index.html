<style>
  :root { --ink:#1b1b1b; --grey:#6b6b6b; --bg:#fff; --skel:#f0f0f0; --gap:20px; --top:clamp(18px,3.4vw,46px); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--ink); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:500; font-size:19px; letter-spacing:-.02em; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; letter-spacing:inherit; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:3px; }

  /* logo fixe = bouton home + lien info */
  .name { position:fixed; top:var(--top); left:clamp(20px,10vw,140px); z-index:20; display:block; width:clamp(190px,36vw,520px); line-height:0; }
  .name, .name img, .info { cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-user-drag:none; }
  .name { transition:opacity .2s; }
  .name:hover { opacity:.55; }
  .name img { display:block; width:100%; height:auto; }
  /* calque blanc du logo : un dégradé continu (sans coupure) qui le rend blanc là où le fond est sombre */
  .name { --m:linear-gradient(transparent,transparent); }
  .name .over { position:absolute; top:0; left:0; height:100%; pointer-events:none; filter:brightness(0) invert(1); -webkit-mask-image:var(--m); mask-image:var(--m); }
  .info, footer { transition:color .2s, opacity .2s; }
  .on-dark { color:#fff; }
  .info { position:fixed; top:calc(var(--top) + 4px); right:var(--gap); z-index:20; font-size:clamp(22px,2.1vw,30px); font-weight:700; letter-spacing:-.04em; padding:6px 10px; display:none; }
  .info.on { display:block; }
  .info:hover { opacity:.55; }

  /* images : fond léger seulement PENDANT le chargement, puis fondu */
  .thumb { width:100%; background:var(--skel); position:relative; overflow:hidden; }
  .thumb.loaded { background:none; }
  .thumb img { display:block; width:100%; height:auto; opacity:0; transition:opacity .45s ease; }
  .thumb.loaded img { opacity:1; }
  .thumb.failed { display:none; }

  /* grille principale */
  main { display:flex; gap:var(--gap); padding:clamp(80px,9vw,120px) var(--gap) 90px; align-items:flex-start; }
  .col { flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--gap); }
  .card { display:block; width:100%; text-align:left; opacity:0; transform:translateY(10px); animation:rise .55s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { to { opacity:1; transform:none; } }
  .cap { padding-top:8px; font-size:18px; }
  .cap small { color:var(--grey); font-size:inherit; font-weight:400; margin-left:6px; }
  @media (hover:hover) {
    .card .thumb img { transition:opacity .45s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
    .card:hover .thumb img { transform:scale(1.025); }
  }

  footer { position:fixed; left:var(--gap); bottom:14px; font-size:18px; z-index:15; pointer-events:none; }

  /* panneau projet / info */
  .veil { position:fixed; inset:0; background:rgba(255,255,255,.88); opacity:0; visibility:hidden; transition:opacity .35s, visibility .35s; z-index:30; }
  .panel { position:fixed; top:0; right:0; bottom:0; width:50%; background:var(--bg); z-index:31; overflow-y:auto; overscroll-behavior:contain; padding:0 var(--gap) 60px; transform:translateX(100%); transition:transform .4s cubic-bezier(.2,.7,.2,1); will-change:transform; }
  body.open .veil { opacity:1; visibility:visible; }
  body.open .panel { transform:none; }
  body.open { overflow:hidden; }
  .panel header { position:sticky; top:0; background:var(--bg); display:flex; justify-content:space-between; align-items:baseline; padding:22px 0 24px; margin-bottom:12px; font-size:clamp(28px,3vw,44px); font-weight:700; letter-spacing:-.04em; z-index:2; }
  .close { font-size:clamp(15px,1.3vw,18px); font-weight:500; letter-spacing:-.01em; }
  .close:hover { text-decoration:underline; text-underline-offset:4px; }
  .panel p { margin:6px 0 18px; font-weight:400; font-size:17px; max-width:60ch; color:#444; line-height:1.45; }
  .links { list-style:none; margin:8px 0 24px; }
  .links a { display:inline-block; padding:4px 0; font-size:clamp(22px,2.2vw,32px); font-weight:700; letter-spacing:-.04em; }
  .links a:hover { text-decoration:underline; text-underline-offset:6px; }

  /* navigation projet précédent / suivant */
  .pn { display:flex; justify-content:space-between; gap:var(--gap); margin-top:56px; padding-top:22px; }
  .pn a { display:block; max-width:48%; }
  .pn small { display:block; font-size:15px; font-weight:500; color:var(--grey); margin-bottom:6px; letter-spacing:-.01em; }
  .pn b { display:block; font-size:clamp(20px,2vw,28px); font-weight:700; letter-spacing:-.04em; line-height:1.1; }
  .pn .next { margin-left:auto; text-align:right; }
  .pn a:hover b { text-decoration:underline; text-underline-offset:5px; }

  /* galerie du panneau : chaque rangée a des images de même hauteur, sans trous */
  .imgs { display:flex; flex-direction:column; gap:var(--gap); }
  .row { display:flex; gap:var(--gap); align-items:flex-start; }
  .row .thumb { min-width:0; }
  .imgs .thumb img { cursor:zoom-in; }

  /* zoom + carrousel */
  .lb { position:fixed; inset:0; z-index:50; background:#fff; display:flex; flex-direction:column; opacity:0; visibility:hidden; transition:opacity .25s, visibility .25s; }
  .lb.on { opacity:1; visibility:visible; }
  .lb-top { display:flex; justify-content:space-between; align-items:baseline; padding:20px var(--gap); font-size:clamp(15px,1.3vw,18px); font-weight:600; letter-spacing:-.02em; }
  .lb-top .close { font-weight:500; }
  .lb-stage { flex:1; min-height:0; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:0 clamp(70px,9vw,130px); }
  .lb-stage img { max-width:100%; max-height:calc(100vh - 130px); max-height:calc(100dvh - 130px); width:auto; height:auto; object-fit:contain; display:block; transition:opacity .2s; transform-origin:0 0; touch-action:none; user-select:none; -webkit-user-drag:none; cursor:zoom-in; will-change:transform; }
  .lb-stage img.anim { transition:opacity .2s, transform .35s cubic-bezier(.2,.7,.2,1); }
  .lb-stage img.swap { opacity:0; }
  .lb.zoomed .lb-stage img { cursor:grab; }
  .lb.dragging .lb-stage img { cursor:grabbing; }
  .lb.zoomed .arrow, .lb.zoomed .lb-bot { opacity:0; pointer-events:none; }
  .lb-bot { padding:18px var(--gap) 22px; text-align:center; font-size:15px; font-weight:400; color:var(--grey); letter-spacing:.02em; }
  .arrow { position:absolute; top:50%; transform:translateY(-50%); padding:22px; color:var(--ink); opacity:.5; transition:opacity .2s, transform .2s; }
  .arrow svg { display:block; width:44px; height:22px; }
  .arrow:hover { opacity:1; }
  .arrow.prev { left:calc(var(--gap) / 2); }
  .arrow.next { right:calc(var(--gap) / 2); }
  .arrow.prev:hover { transform:translateY(-50%) translateX(-4px); }
  .arrow.next:hover { transform:translateY(-50%) translateX(4px); }
  .lb.single .arrow, .lb.single .lb-bot { display:none; }

  /* curseur « disque » (souris uniquement) : view / zoom / close */
  .cur { position:fixed; left:0; top:0; z-index:60; pointer-events:none; will-change:transform; }
  .cur i { display:flex; align-items:center; justify-content:center; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; background:var(--ink); color:#fff; font-style:normal; font-size:13px; font-weight:500; letter-spacing:-.01em; transform:scale(.2); opacity:0; transition:transform .28s cubic-bezier(.2,.7,.2,1), opacity .2s, background-color .25s, color .25s; }
  .cur.on-dark i { background:#fff; color:var(--ink); }
  .cur.on i { transform:scale(1); opacity:1; }
  body.has-cur .card, body.has-cur .card *, body.has-cur .imgs .thumb img, body.has-cur .veil, body.has-cur .lb:not(.zoomed) .lb-stage, body.has-cur .lb:not(.zoomed) .lb-stage img { cursor:none; }

  @media (max-width:760px) {
    .name { left:20px; top:18px; }
    .info { top:16px; right:10px; font-size:24px; }
    main { padding-top:78px; }
    .panel { width:100%; }
    .row { flex-direction:column; }
    .row .thumb { flex:none !important; width:100%; }
    footer { display:none; }
    .lb-stage { padding:0 var(--gap); }
    .arrow { top:auto; bottom:2px; transform:none; padding:16px 22px; opacity:.7; }
    .arrow.prev:hover, .arrow.next:hover { transform:none; }
    .arrow.prev { left:var(--gap); } .arrow.next { right:var(--gap); }
  }
  @media (prefers-reduced-motion:reduce) {
    * { transition:none !important; }
    .card { animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<a class="name" id="home" href="./" aria-label="maxène boukhellouf, retour à l’accueil"><img class="base" src="images/logo.png" alt="maxène boukhellouf" draggable="false"><img class="over" src="images/logo.png" alt="" aria-hidden="true" draggable="false"></a>
<a class="info" id="info-btn" href="#info">info</a>
<main id="grid" aria-label="Projets"></main>
<footer>All Rights Reserved © 2026</footer>

<div class="veil" id="veil"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <header><span id="p-title"></span><button class="close" id="close">Close</button></header>
  <div id="p-extra"></div>
  <div class="imgs" id="p-imgs"></div>
  <nav class="pn" id="p-nav" aria-label="Autres projets"></nav>
</aside>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Agrandissement de l’image">
  <div class="lb-top"><span id="lb-title"></span><button class="close" id="lb-close">Close</button></div>
  <div class="lb-stage" id="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bot" id="lb-count"></div>
  <button class="arrow prev" id="lb-prev" aria-label="Image précédente"><svg viewBox="0 0 44 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M42 11H3M12 2L3 11l9 9"/></svg></button>
  <button class="arrow next" id="lb-next" aria-label="Image suivante"><svg viewBox="0 0 44 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11h39M32 2l9 9-9 9"/></svg></button>
</div>

<div class="cur" id="cur" aria-hidden="true"><i></i></div>

<script>
/* charge projets.js à neuf à chaque visite : tes modifications apparaissent tout de suite, sans attendre le cache */
document.write('<script src="projets.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
if (typeof projects === 'undefined') {
  document.getElementById('grid').innerHTML = '<p style="padding:20px;font-weight:400">projets.js est introuvable : lance mettre-a-jour.command, puis mets tous les fichiers en ligne (index.html, projets.js et les dossiers images, projets, miniatures).</p>';
  throw new Error('projets.js manquant');
}
const FALLBACK = 4 / 3;
const BASE_TITLE = document.title;
const $ = id => document.getElementById(id);
const grid = $('grid'), panel = $('panel'), pImgs = $('p-imgs'), pExtra = $('p-extra'), pNav = $('p-nav');
const mq = matchMedia('(max-width:760px)');
const ABOUT = (typeof about !== 'undefined') ? about : null;
const hasAbout = !!(ABOUT && ((ABOUT.texte && ABOUT.texte.length) || (ABOUT.links && ABOUT.links.length)));
let items = [];            // projets affichables + format de leur couverture
let currentProject = null; // projet ouvert dans le panneau
let currentList = [];      // indices des images chargées du projet ouvert
let panelToken = 0, routeToken = 0;

/* ---------- statistiques de visites (GoatCounter : sans cookies) ---------- */
const STATS = (ABOUT && ABOUT.stats) || '';
const STATS_ON = !!STATS && location.protocol !== 'file:';
let lastPath = null;
if (STATS_ON) {
  window.goatcounter = { no_onload:true };                 // on compte nous-mêmes chaque projet ouvert
  const sc = document.createElement('script');
  sc.async = true; sc.src = 'https://gc.zgo.at/count.js';
  sc.setAttribute('data-goatcounter', 'https://' + STATS + '.goatcounter.com/count');
  document.head.appendChild(sc);
}
function trackView(path, title) {                         // une vue = un projet ouvert (pas les allers-retours vers l'accueil)
  if (path === lastPath) return;
  const first = lastPath === null; lastPath = path;
  if (!STATS_ON || (path === '/' && !first)) return;
  let tries = 0;
  const send = () => {
    if (window.goatcounter && window.goatcounter.count) { window.goatcounter.count({ path, title }); return true; }
    return ++tries > 40;
  };
  if (!send()) { const t = setInterval(() => { if (send()) clearInterval(t); }, 250); }
}

/* ---------- projets : adresse (slug) et miniatures ---------- */
function slugOf(p) {
  let f = (p.images[0] || '').split('/')[1] || p.title;
  try { f = decodeURIComponent(f); } catch (e) {}
  return f.replace(/^\d+[-_ ]*/, '').toLowerCase();
}
projects.forEach(p => { p.slug = slugOf(p); });
const thumbSrc = (p, i) => (p.thumbs && p.thumbs[i]) || p.images[i];

/* ---------- utilitaires ---------- */
// Connaît le format réel d'une image avant l'affichage (évite les sauts de mise en page)
function measure(src, timeout, alt) {
  return new Promise(res => {
    const i = new Image(); i.decoding = 'async';
    let cur = src, tried = !alt || alt === src;
    const t = setTimeout(() => res({ ok:true, ratio:FALLBACK, late:true, src:cur }), timeout);
    i.onload  = () => { clearTimeout(t); res({ ok:true, ratio:(i.naturalWidth / i.naturalHeight) || FALLBACK, src:cur }); };
    i.onerror = () => {
      if (!tried) { tried = true; cur = alt; i.src = alt; return; }   // miniature absente : on prend l'image d'origine
      clearTimeout(t); res({ ok:false, ratio:FALLBACK, src:cur });
    };
    i.src = src;
  });
}
function thumb(src, p, ratio, eager, idx) {
  const d = document.createElement('div');
  d.className = 'thumb';
  d.style.aspectRatio = ratio || FALLBACK;
  const img = new Image();
  img.alt = p.title; img.decoding = 'async'; img.loading = eager ? 'eager' : 'lazy';
  img.dataset.i = idx;
  img.onload  = () => { d.style.aspectRatio = img.naturalWidth + ' / ' + img.naturalHeight; d.classList.add('loaded'); scheduleAdapt(); };
  let triedAlt = !p.images[idx] || p.images[idx] === src;
  img.onerror = () => {
    if (!triedAlt) { triedAlt = true; img.src = p.images[idx]; return; }   // miniature absente : image d'origine
    d.classList.add('failed');
  };
  img.src = src;
  d.appendChild(img);
  return d;
}
// Précharge les miniatures d'un projet quand on survole / touche sa vignette
const warmed = new Set();
function prefetch(p) {
  if (warmed.has(p)) return; warmed.add(p);
  p.images.forEach((_, i) => { const im = new Image(); im.decoding = 'async'; im.src = thumbSrc(p, i); });
}

/* ---------- navigation (adresse + bouton retour du navigateur) ---------- */
function push(h) {
  if (location.hash === h) return;
  try { history.pushState({ site:1 }, '', h); route(); } catch (e) { location.hash = h; }
}
function replaceHash(h, force) {
  try { history.replaceState(history.state, '', h || (location.pathname + location.search)); }
  catch (e) { if (force) location.hash = h; }   // repli pour les navigateurs qui refusent replaceState
}
function swapProject(h) {                    // passer d'un projet à l'autre SANS empiler l'historique : « Close » ferme toujours le panneau
  replaceHash(h, true); route();
}
function back() {
  if (history.state && history.state.site) { history.back(); return; }
  let name = ''; try { name = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  const parts = name.split('/');
  replaceHash(parts.length > 1 ? '#' + encodeURIComponent(parts[0]) : '', true);
  route();
}
async function route() {
  const t = ++routeToken;
  let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  const [name, idx] = h.split('/');
  if (name === 'info' && hasAbout) { trackView('/info', 'info'); lbHide(); showAbout(); return; }
  const p = name ? projects.find(x => x.slug === name) : null;
  if (!p) { trackView('/', 'accueil'); lbHide(); closePanelUI(); return; }
  trackView('/' + p.slug, p.title);
  await showProject(p);
  if (t !== routeToken) return;
  const k = parseInt(idx, 10) - 1;
  if (idx && k >= 0 && k < currentList.length) lbOpenAt(k); else lbHide();
}
addEventListener('popstate', route);

/* ---------- grille principale ---------- */
function card(p, ratio, i, src) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = '#' + encodeURIComponent(p.slug);
  a.style.animationDelay = Math.min(i * 70, 700) + 'ms';
  a.appendChild(thumb(src || thumbSrc(p, 0), p, ratio, i < 6, 0));
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.innerHTML = '<span></span>' + (p.date ? '<small></small>' : '');
  cap.firstChild.textContent = p.title;
  if (p.date) cap.lastChild.textContent = p.date;
  a.appendChild(cap);
  a.addEventListener('pointerenter', () => prefetch(p), { once:true });
  a.addEventListener('touchstart',   () => prefetch(p), { once:true, passive:true });
  a.addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;   // ouvrir dans un nouvel onglet : comportement normal
    e.preventDefault(); push(a.getAttribute('href'));
  });
  return a;
}
// Répartit les projets dans la colonne la moins haute : colonnes équilibrées
function buildGrid() {
  grid.innerHTML = '';
  const n = mq.matches ? 1 : 2;
  const cols = Array.from({ length:n }, () => { const c = document.createElement('div'); c.className = 'col'; grid.appendChild(c); return c; });
  const h = Array(n).fill(0);
  items.forEach((it, i) => {
    const k = h.indexOf(Math.min(...h));
    cols[k].appendChild(card(it.p, it.ratio, i, it.src));
    h[k] += 1 / it.ratio + 0.09;
  });
  scheduleAdapt();
}
Promise.all(projects.map(p => measure(thumbSrc(p, 0), 1200, p.images[0]))).then(rs => {
  items = projects.map((p, i) => ({ p, ratio:rs[i].ratio, ok:rs[i].ok, src:rs[i].src })).filter(x => x.ok);
  buildGrid();
  if (!items.length) grid.innerHTML = '<p style="padding:20px;font-weight:400">Aucune image trouvée : vérifie que les dossiers projets et miniatures sont bien en ligne.</p>';
});
(mq.addEventListener ? mq.addEventListener('change', buildGrid) : mq.addListener(buildGrid));

/* ---------- panneau : projet ou info ---------- */
function openPanelUI(title) {
  $('p-title').textContent = title;
  pImgs.innerHTML = ''; pExtra.innerHTML = ''; pNav.innerHTML = '';
  panel.scrollTop = 0;
  document.body.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  document.title = title + ' — ' + BASE_TITLE;
  scheduleAdapt();
  $('close').focus({ preventScroll:true });
}
function closePanelUI() {
  panelToken++; currentProject = null; currentList = [];
  document.body.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  document.title = BASE_TITLE;
  scheduleAdapt();
}

// Rangées : 1re image en grand ; ensuite 2 par rangée si leurs formats se ressemblent, sinon pleine largeur
function buildRows(list) {
  const out = [];
  if (!list.length) return out;
  out.push([list[0]]);
  let k = 1;
  while (k < list.length) {
    const a = list[k], b = list[k + 1];
    if (b && Math.max(a.ratio, b.ratio) / Math.min(a.ratio, b.ratio) <= 2.4) { out.push([a, b]); k += 2; }
    else { out.push([a]); k++; }
  }
  return out;
}
async function showProject(p) {
  if (currentProject === p && document.body.classList.contains('open')) return;
  const t = ++panelToken;
  currentProject = p; currentList = [];
  openPanelUI(p.title);
  if (p.text) { const el = document.createElement('p'); el.textContent = p.text; pExtra.appendChild(el); }
  const ms = await Promise.all(p.images.map((_, i) => measure(thumbSrc(p, i), 2500, p.images[i])));
  if (t !== panelToken) return;
  const list = [];
  ms.forEach((m, i) => { if (m.ok) list.push({ i, ratio:m.ratio, src:m.src }); });
  currentList = list.map(x => x.i);
  buildRows(list).forEach(r => {
    const row = document.createElement('div'); row.className = 'row';
    r.forEach(x => {
      const th = thumb(x.src || thumbSrc(p, x.i), p, x.ratio, x.i < 4, x.i);
      th.style.flex = (x.ratio * 1000) + ' 1 0%';     // largeur proportionnelle au format => même hauteur dans la rangée
      row.appendChild(th);
    });
    pImgs.appendChild(row);
  });
  buildNav(p);
}
function buildNav(p) {                       // « Prev / Next » vers les autres projets
  pNav.innerHTML = '';
  const n = projects.length; if (n < 2) return;
  const i = projects.indexOf(p);
  const mk = (q, cls, label) => {
    const a = document.createElement('a');
    a.className = cls; a.href = '#' + encodeURIComponent(q.slug);
    a.innerHTML = '<small></small><b></b>';
    a.firstChild.textContent = label; a.lastChild.textContent = q.title;
    a.addEventListener('click', e => { if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return; e.preventDefault(); swapProject(a.getAttribute('href')); });
    return a;
  };
  if (n > 2) pNav.appendChild(mk(projects[(i - 1 + n) % n], 'prev', '← Prev'));
  pNav.appendChild(mk(projects[(i + 1) % n], 'next', 'Next →'));
}
function showAbout() {                       // page info : présentation + contacts
  panelToken++; currentProject = null; currentList = [];
  openPanelUI('info');
  (ABOUT.texte || []).forEach(l => { const el = document.createElement('p'); el.textContent = l; pExtra.appendChild(el); });
  if (ABOUT.links && ABOUT.links.length) {
    const ul = document.createElement('ul'); ul.className = 'links';
    ABOUT.links.forEach(l => {
      const li = document.createElement('li'), a = document.createElement('a');
      a.textContent = l.label; a.href = l.href;
      if (!/^mailto:/.test(l.href)) { a.target = '_blank'; a.rel = 'noopener'; }
      li.appendChild(a); ul.appendChild(li);
    });
    pExtra.appendChild(ul);
  }
}
$('close').onclick = back;
$('veil').onclick = back;
$('home').onclick = e => {
  e.preventDefault();
  if (location.hash) { replaceHash('', true); route(); }
  window.scrollTo({ top:0, behavior:'smooth' });
};

if (hasAbout) {
  $('info-btn').classList.add('on');
  $('info-btn').onclick = e => { e.preventDefault(); push('#info'); };
}

/* ---------- zoom + carrousel ---------- */
const lb = $('lb'), lbImg = $('lb-img'), stage = $('lb-stage');
let lbList = [], lbIdx = 0, lbTitle = '';
function lbShow(i, instant) {
  zReset();
  lbIdx = (i + lbList.length) % lbList.length;
  const set = () => {
    const p = currentProject; if (!p) return;
    const n = lbList.length;
    lbImg.src = p.images[lbList[lbIdx]];
    lbImg.alt = lbTitle + ' (' + (lbIdx + 1) + '/' + n + ')';
    $('lb-count').textContent = (lbIdx + 1) + ' / ' + n;
    lbImg.classList.remove('swap');
    [1, -1].forEach(d => { const im = new Image(); im.src = p.images[lbList[(lbIdx + d + n) % n]]; });
    if (!instant) replaceHash('#' + encodeURIComponent(p.slug) + '/' + (lbIdx + 1));
  };
  if (instant) return set();
  lbImg.classList.add('swap'); setTimeout(set, 120);
}
function lbOpenAt(k) {
  lbList = currentList.slice();
  lbTitle = currentProject.title;
  $('lb-title').textContent = lbTitle;
  lb.classList.toggle('single', lbList.length < 2);
  lb.classList.add('on');
  lbShow(k, true);
  $('lb-close').focus({ preventScroll:true });
}
function lbHide() { lb.classList.remove('on'); zReset(); }
pImgs.addEventListener('click', e => {
  const img = e.target.closest('.thumb img');
  if (!img || !currentProject) return;
  const k = currentList.indexOf(+img.dataset.i);
  if (k >= 0) push('#' + encodeURIComponent(currentProject.slug) + '/' + (k + 1));
});
$('lb-close').onclick = back;
$('lb-prev').onclick = () => lbShow(lbIdx - 1);
$('lb-next').onclick = () => lbShow(lbIdx + 1);
stage.addEventListener('click', e => { if (e.target === stage && z === 1) back(); });

addEventListener('keydown', e => {
  if (lb.classList.contains('on')) {
    if (e.key === 'Escape') { if (z > 1) { z = 1; zx = zy = 0; zApply(true); } else back(); }
    else if (e.key === 'ArrowRight' && lbList.length > 1) lbShow(lbIdx + 1);
    else if (e.key === 'ArrowLeft'  && lbList.length > 1) lbShow(lbIdx - 1);
  } else if (e.key === 'Escape' && document.body.classList.contains('open')) back();
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && currentProject && projects.length > 1 && document.body.classList.contains('open')) {
    const n = projects.length, i = projects.indexOf(currentProject);
    swapProject('#' + encodeURIComponent(projects[(i + (e.key === 'ArrowRight' ? 1 : -1) + n) % n].slug));
  }
});
let tx = null;
lb.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
lb.addEventListener('touchend', e => {
  if (tx === null || lbList.length < 2 || z > 1) { tx = null; return; }
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) lbShow(lbIdx + (dx < 0 ? 1 : -1));
});

/* zoom dans l'agrandissement : clic, glisser, molette / pincement */
let z = 1, zx = 0, zy = 0, dragging = false, pressed = null;
const MAXZ = 5;
lbImg.draggable = false;
function zApply(anim) {
  lbImg.classList.toggle('anim', !!anim);
  lbImg.style.transform = z === 1 ? '' : 'translate(' + zx + 'px,' + zy + 'px) scale(' + z + ')';
  lb.classList.toggle('zoomed', z > 1);
}
function zClamp() {                       // l'image ne peut pas sortir du cadre
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const w = lbImg.offsetWidth * z, h = lbImg.offsetHeight * z, ox = lbImg.offsetLeft, oy = lbImg.offsetTop;
  zx = w <= sw ? (sw - w) / 2 - ox : Math.min(-ox, Math.max(sw - w - ox, zx));
  zy = h <= sh ? (sh - h) / 2 - oy : Math.min(-oy, Math.max(sh - h - oy, zy));
}
function zoomAt(nz, px, py, anim) {       // zoome en gardant le point (px,py) sous le curseur
  nz = Math.min(MAXZ, Math.max(1, nz)); if (nz < 1.03) nz = 1;
  const r = stage.getBoundingClientRect();
  const ax = px - r.left - lbImg.offsetLeft, ay = py - r.top - lbImg.offsetTop;
  const lx = (ax - zx) / z, ly = (ay - zy) / z;
  z = nz; zx = ax - lx * z; zy = ay - ly * z;
  if (z === 1) { zx = 0; zy = 0; } else zClamp();
  zApply(anim);
}
function zReset() { z = 1; zx = 0; zy = 0; dragging = false; pressed = null; lb.classList.remove('dragging'); zApply(false); }
lbImg.addEventListener('click', e => {
  if (dragging) return;
  e.stopPropagation();
  if (z > 1) zoomAt(1, e.clientX, e.clientY, true);
  else zoomAt(Math.max(2, Math.min(3, lbImg.naturalWidth / lbImg.offsetWidth)), e.clientX, e.clientY, true);
});
lbImg.addEventListener('pointerdown', e => {
  if (z > 1) { pressed = { x:e.clientX, y:e.clientY, moved:false }; lbImg.setPointerCapture(e.pointerId); }
});
lbImg.addEventListener('pointermove', e => {
  if (!pressed) return;
  const dx = e.clientX - pressed.x, dy = e.clientY - pressed.y;
  if (!pressed.moved && Math.hypot(dx, dy) < 4) return;
  pressed.moved = true; dragging = true; lb.classList.add('dragging');
  zx += dx; zy += dy; pressed.x = e.clientX; pressed.y = e.clientY;
  zClamp(); zApply(false);
});
const endDrag = () => { pressed = null; lb.classList.remove('dragging'); setTimeout(() => { dragging = false; }, 0); };
lbImg.addEventListener('pointerup', endDrag);
lbImg.addEventListener('pointercancel', endDrag);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)), e.clientX, e.clientY, false);
}, { passive:false });
addEventListener('resize', () => { if (z > 1) zReset(); });

/* ---------- lisibilité : logo et pied de page passent en blanc sur les images sombres ---------- */
const lumCache = new WeakMap();
function lumData(img) {                      // version minuscule de l'image, pour mesurer sa luminosité
  const key = img.currentSrc || img.src;
  let c = lumCache.get(img);
  if (c !== undefined && c.key === key) return c.v;
  if (!img.complete || !img.naturalWidth) return null;
  try {
    const w = 160, h = Math.max(1, Math.round(w * img.naturalHeight / img.naturalWidth));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d', { willReadFrequently:true });
    cx.drawImage(img, 0, 0, w, h);
    cx.getImageData(0, 0, 1, 1);             // erreur si le navigateur interdit la lecture (ex. fichier ouvert hors ligne)
    c = { cx, w, h };
  } catch (e) { c = false; }
  lumCache.set(img, { key, v:c });
  return c;
}
function imgRects(area) {                    // images de la grille qui touchent une zone de l'écran
  const out = [];
  grid.querySelectorAll('.thumb.loaded img').forEach(img => {
    const b = img.getBoundingClientRect();
    if (!b.width || !b.height || b.right < area.left || b.left > area.right || b.bottom < area.top || b.top > area.bottom) return;
    const d = lumData(img); if (d) out.push({ b, d });
  });
  return out;
}
function lumBehind(r, list) {                // luminosité moyenne (0 noir, 1 blanc) derrière un rectangle de l'écran
  let sum = 0, covered = 0;
  (list || imgRects(r)).forEach(({ b, d }) => {
    const x0 = Math.max(r.left, b.left), x1 = Math.min(r.right, b.right), y0 = Math.max(r.top, b.top), y1 = Math.min(r.bottom, b.bottom);
    if (x1 <= x0 || y1 <= y0) return;
    const sx = Math.min(d.w - 1, Math.floor((x0 - b.left) / b.width * d.w)), sy = Math.min(d.h - 1, Math.floor((y0 - b.top) / b.height * d.h));
    const sw = Math.max(1, Math.min(d.w - sx, Math.ceil((x1 - x0) / b.width * d.w))), sh = Math.max(1, Math.min(d.h - sy, Math.ceil((y1 - y0) / b.height * d.h)));
    const px = d.cx.getImageData(sx, sy, sw, sh).data;
    let l = 0, n = 0;
    for (let i = 0; i < px.length; i += 4) {
      const a = px[i + 3] / 255, lum = (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255;
      l += a * lum + (1 - a); n++;           // les zones transparentes comptent comme du blanc
    }
    if (!n) return;
    const area = (x1 - x0) * (y1 - y0); sum += (l / n) * area; covered += area;
  });
  const total = r.width * r.height;
  return total > 0 ? (sum + (total - covered)) / total : 1;
}
const logoEl = $('home'), SEG = 48;
const logoL = [], logoT = [];
let logoMask = '', logoLast = 0, logoPrev = 0, loopUntil = 0, loopOn = false;
function setLogoMask(m) { if (m !== logoMask) { logoMask = m; logoEl.style.setProperty('--m', m); } }
/* Logo : le blanc apparaît PROGRESSIVEMENT là où le fond est sombre, en dégradé continu (pas de coupure dans les lettres).
   La luminosité est « floutée » dans l'espace (zone large autour de chaque point) et dans le temps (~0,2 s). */
function logoStep(now) {
  const r = logoEl.getBoundingClientRect();
  if (document.body.classList.contains('open') || !r.width) {
    setLogoMask('linear-gradient(transparent,transparent)'); logoL.length = 0; logoT.length = 0; return;
  }
  const dt = logoPrev ? Math.min(100, now - logoPrev) : 0; logoPrev = now;
  if (now - logoLast > 45) {                                   // mesure environ toutes les 45 ms
    logoLast = now;
    const spread = Math.max(30, r.width * 0.09), vy = r.height * 0.5;
    const list = imgRects({ left:r.left - spread, right:r.right + spread, top:r.top - vy, bottom:r.bottom + vy });
    for (let i = 0; i < SEG; i++) {
      const x = r.left + r.width * (i + 0.5) / SEG;
      logoT[i] = lumBehind({ left:x - spread, right:x + spread, top:r.top - vy, bottom:r.bottom + vy, width:spread * 2, height:r.height + vy * 2 }, list);
    }
  }
  const k = 1 - Math.exp(-dt / 180);
  const stops = [];
  for (let i = 0; i < SEG; i++) {
    if (logoT[i] === undefined) return;
    logoL[i] = logoL[i] === undefined ? logoT[i] : logoL[i] + (logoT[i] - logoL[i]) * k;
    const o = Math.max(0, Math.min(1, (0.58 - logoL[i]) / 0.22));   // clair => noir, sombre => blanc, entre les deux => fondu
    stops.push('rgba(0,0,0,' + o.toFixed(2) + ') ' + ((i + 0.5) / SEG * 100).toFixed(2) + '%');
  }
  setLogoMask('linear-gradient(to right,' + stops.join(',') + ')');
}
function logoLoop(now) {
  logoStep(now);
  if (now < loopUntil) requestAnimationFrame(logoLoop); else { loopOn = false; logoPrev = 0; }
}
function kickLogo() {
  loopUntil = performance.now() + 1100;
  if (!loopOn) { loopOn = true; requestAnimationFrame(logoLoop); }
}
const adaptEls = [$('info-btn'), document.querySelector('footer')];
function adapt() {
  const open = document.body.classList.contains('open');
  adaptEls.forEach(el => {
    if (open) { el.classList.remove('on-dark'); return; }
    const r = el.getBoundingClientRect(); if (!r.width) return;
    const l = lumBehind(r), was = el.classList.contains('on-dark');
    el.classList.toggle('on-dark', was ? l < 0.52 : l < 0.42);
  });
}
let adaptQueued = false, settleT;
function scheduleAdapt() {
  kickLogo();
  if (!adaptQueued) { adaptQueued = true; requestAnimationFrame(() => { adaptQueued = false; adapt(false); }); }
  clearTimeout(settleT); settleT = setTimeout(() => adapt(true), 140);   // une fois le défilement arrêté : mesure exacte
}
addEventListener('scroll', scheduleAdapt, { passive:true });
addEventListener('resize', scheduleAdapt);

/* ---------- curseur « disque » : view (projets) · zoom (images) · close (fond) — souris uniquement ----------
   Noir sur fond clair, blanc sur fond sombre (même principe que le logo). */
if (matchMedia('(hover:hover) and (pointer:fine)').matches) {
  const cur = $('cur'), curText = cur.querySelector('i');
  const REDUCE = matchMedia('(prefers-reduced-motion:reduce)').matches;
  let mx = -200, my = -200, cx = -200, cy = -200, seen = false, looping = false, curLbl = '';
  let curElem = null, curL = 1, curDark = false, curLastT = 0;
  document.body.classList.add('has-cur');
  const place = () => { cur.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)'; };
  function curLoop() {                       // le disque suit la souris avec un léger retard
    const k = REDUCE ? 1 : 0.22;
    cx += (mx - cx) * k; cy += (my - cy) * k; place();
    if (Math.abs(mx - cx) > 0.3 || Math.abs(my - cy) > 0.3) requestAnimationFrame(curLoop); else looping = false;
  }
  const curKick = () => { if (!looping) { looping = true; requestAnimationFrame(curLoop); } };
  function curLabel(t) {                     // que faut-il écrire dans le disque, selon l'élément sous la souris ?
    if (!t || !t.closest) return '';
    if (lb.classList.contains('on')) {
      if (t.closest('.arrow, .lb-top, .lb-bot') || z > 1) return '';
      if (t === lbImg) return 'zoom';
      if (t === stage) return 'close';
      return '';
    }
    if (document.body.classList.contains('open')) {
      if (t.closest('.panel')) return (t.tagName === 'IMG' && t.closest('#p-imgs')) ? 'zoom' : '';
      return t.closest('.veil') ? 'close' : '';
    }
    return t.closest('.card') ? 'view' : '';
  }
  function curMeasure() {                    // luminosité (0 noir, 1 blanc) autour du curseur : seule une image peut être sombre
    if (!curElem || curElem.tagName !== 'IMG') return 1;
    const d = lumData(curElem); if (!d) return 1;
    const sp = 36;
    return lumBehind({ left:mx - sp, right:mx + sp, top:my - sp, bottom:my + sp, width:sp * 2, height:sp * 2 }, [{ b:curElem.getBoundingClientRect(), d }]);
  }
  function curAdapt(first) {                 // lissage + hystérésis : le disque ne clignote pas sur les images détaillées
    if (!curLbl) return;
    const now = performance.now(), dt = Math.min(250, now - curLastT); curLastT = now;
    const l = curMeasure();
    if (first || dt > 150) curL = l; else curL += (l - curL) * (1 - Math.exp(-dt / 140));
    const dark = first ? curL < 0.45 : (curDark ? curL < 0.52 : curL < 0.40);
    if (dark !== curDark) { curDark = dark; cur.classList.toggle('on-dark', dark); }
  }
  function setCur(l) {
    if (l === curLbl) return;
    if (!curLbl) { cx = mx; cy = my; place(); }   // il apparaît sous la souris, sans glisser depuis un coin
    curLbl = l;
    if (l) { curText.textContent = l; cur.classList.add('on'); curAdapt(true); } else cur.classList.remove('on');
  }
  let lastMove = 0;
  addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    mx = e.clientX; my = e.clientY; seen = true; curElem = e.target;
    setCur(curLabel(e.target)); curKick();
    const now = performance.now(); if (now - lastMove > 40) { lastMove = now; curAdapt(false); }
  }, { passive:true });
  const recheck = () => { if (!seen) return; curElem = document.elementFromPoint(mx, my); setCur(curLabel(curElem)); curAdapt(false); };
  addEventListener('scroll', recheck, { passive:true });
  addEventListener('click', () => setTimeout(recheck, 80));
  setInterval(recheck, 200);                 // met à jour libellé et couleur quand le contenu change sous une souris immobile
  document.documentElement.addEventListener('mouseleave', () => { seen = false; setCur(''); });
}

route();   // ouvre directement un projet si l'adresse contient #nom-du-projet
</script>
